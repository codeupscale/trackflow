; Local development performance.
;
; The app is served by PHP's built-in server (`php -S`, see the Sail image's
; start command), which runs under the CLI SAPI — where opcache is off by
; default. With the project bind-mounted from Windows, every request was
; therefore re-reading and recompiling the whole framework off a filesystem
; measured at 14.6ms per file read and 4.3ms per stat, against 0.02ms for the
; container's own disk. That is ~700x slower, and it made a request that does
; nothing take 3-5 seconds.
;
; enable_cli is what makes opcache apply at all here.
opcache.enable=1
opcache.enable_cli=1

; The decisive setting. With timestamp validation on, opcache still stats every
; cached file to check for changes — a thousand stats per request is seconds on
; a bind mount, even though nothing is re-read.
;
; TRADE-OFF: PHP code changes are NOT picked up until the container restarts.
;   docker compose restart laravel.test
; That is the cost of this file. Front-end changes are unaffected (Next has its
; own dev server); only backend PHP needs the restart.
opcache.validate_timestamps=0

; Room for the whole application plus vendor, so nothing is evicted and
; re-read. The framework alone is several thousand files.
opcache.memory_consumption=512
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=30000

; Resolving a path is itself a filesystem round trip here, so cache those too.
realpath_cache_size=8M
realpath_cache_ttl=600

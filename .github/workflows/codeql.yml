# CodeQL code scanning.
#
# The codeupscale organization ruleset requires CodeQL results before a PR can
# merge into main ("Code scanning is waiting for results from CodeQL"). This
# repo never ran CodeQL, so no PR into main could ever satisfy the rule.
#
# Scans the JavaScript/TypeScript codebases (web, desktop, marketing). CodeQL
# has no PHP support, so the Laravel backend is not covered here.
name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 3 * * 1' # weekly, Monday 03:00 UTC
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

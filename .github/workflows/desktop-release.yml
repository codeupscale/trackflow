name: Desktop Release

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'desktop/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.18). Leave empty to use current package.json version.'
        required: false
        type: string
      platforms:
        description: 'Platforms to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - mac
          - windows
          - linux

permissions:
  contents: write

# Serialize runs per branch: the dev channel's per-version -dev.<n> counter is
# derived from existing tags, so two concurrent develop runs must not resolve
# the same number. Queued, never cancelled — every push still gets its build.
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Preflight: resolve version + channel ─────────────────────────────────────
  # main    → production release  v<version> — a push to main (i.e. develop was merged)
  #           resolves to the next UNRELEASED patch, so a merge ALWAYS ships without a
  #           hand-committed version bump first. An explicit workflow_dispatch version
  #           is still taken literally and skipped if that release already exists.
  # develop → dev PRERELEASE      v<next-version>-dev.<n> — if package.json's version
  #           has already shipped to production, the patch is auto-bumped so dev builds
  #           sort AFTER the release (semver: 1.0.42-dev.N < 1.0.42 < 1.0.43-dev.1),
  #           and <n> is a per-version counter starting at 1 (next after the highest
  #           existing v<version>-dev.* tag).
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      channel: ${{ steps.resolve.outputs.channel }}
      should_release: ${{ steps.resolve.outputs.should_release }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version and channel
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Base version: explicit dispatch input wins, else desktop/package.json
          if [ -n "${{ inputs.version }}" ]; then
            BASE="${{ inputs.version }}"
          else
            BASE=$(node -p 'require("./desktop/package.json").version')
          fi

          if [ "${{ github.ref_name }}" = "main" ]; then
            CHANNEL="production"

            if [ -n "${{ inputs.version }}" ]; then
              # Explicit workflow_dispatch: honour exactly the number asked for, and
              # still refuse to silently republish a version that already shipped.
              VERSION="${BASE}"
              if gh release view "v${VERSION}" --repo ${{ github.repository }} > /dev/null 2>&1; then
                echo "Release v${VERSION} already exists — skipping."
                SHOULD=false
              else
                SHOULD=true
              fi
            else
              # Push to main = develop was merged = this IS the release. Resolve to
              # the next UNRELEASED patch instead of requiring a hand-committed bump
              # in desktop/package.json first. Without this the merge silently
              # produced NO release whenever package.json still held a shipped
              # version (it sat at 1.0.43 while prod was on v1.0.46), which is what
              # forced the "commit a bump to develop, merge to main again" chore.
              # v<BASE> and the dev prereleases v<BASE>-dev.<n> are distinct tags,
              # and semver sorts 1.0.47-dev.2 < 1.0.47, so promoting the version the
              # dev channel has been building is exactly right.
              while gh release view "v${BASE}" --repo ${{ github.repository }} > /dev/null 2>&1; do
                echo "v${BASE} already shipped — bumping patch."
                BASE=$(echo "${BASE}" | awk -F. '{printf "%d.%d.%d", $1, $2, $3 + 1}')
              done
              VERSION="${BASE}"
              SHOULD=true
            fi
          else
            # Non-main (develop, etc.): publish a PRERELEASE with a -dev.<n> suffix.
            # Distinct tag = never collides with or replaces production v<base>.
            CHANNEL="dev"

            # If BASE has already shipped as a production release, this dev build
            # contains post-<BASE> code — auto-bump the patch until we reach an
            # unreleased version so dev builds sort AFTER the shipped release
            # (semver: 1.0.42-dev.N < 1.0.42 < 1.0.43-dev.1). Removes the manual
            # "bump package.json after every prod release" chore.
            while gh release view "v${BASE}" --repo ${{ github.repository }} > /dev/null 2>&1; do
              echo "v${BASE} already shipped to production — bumping patch."
              BASE=$(echo "${BASE}" | awk -F. '{printf "%d.%d.%d", $1, $2, $3 + 1}')
            done

            # Per-version counter: next after the highest existing v<BASE>-dev.<n>
            # tag (1 if none). Tag-derived instead of github.run_number so numbering
            # restarts at -dev.1 for every new version. The workflow-level
            # concurrency group serializes runs, so two builds can't race to the
            # same number.
            LAST=$(gh api "repos/${{ github.repository }}/git/matching-refs/tags/v${BASE}-dev." --jq '.[].ref' 2>/dev/null \
              | sed 's/.*-dev\.//' | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
            N=$(( ${LAST:-0} + 1 ))
            VERSION="${BASE}-dev.${N}"
            SHOULD=true
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "should_release=${SHOULD}" >> "$GITHUB_OUTPUT"
          echo "Resolved → channel=${CHANNEL} version=${VERSION} should_release=${SHOULD}"

      # Pre-create the release ONCE here so the three parallel platform builds only
      # ever UPLOAD assets to it — they never race to create the same release, which
      # previously caused HTTP 422 "Published releases must have a valid tag" on the
      # losing jobs. Dev channel is created as a prerelease.
      - name: Create or reuse the GitHub release
        if: steps.resolve.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.resolve.outputs.version }}"
          if gh release view "$TAG" --repo ${{ github.repository }} >/dev/null 2>&1; then
            echo "Release $TAG already exists — platform builds will upload to it."
          else
            PRERELEASE_FLAG=""
            if [ "${{ steps.resolve.outputs.channel }}" = "dev" ]; then
              PRERELEASE_FLAG="--prerelease"
            fi
            gh release create "$TAG" \
              --repo ${{ github.repository }} \
              --target "${{ github.sha }}" \
              --title "TrackFlow Desktop ${{ steps.resolve.outputs.version }}" \
              --notes "Automated ${{ steps.resolve.outputs.channel }} build of ${{ steps.resolve.outputs.version }}." \
              $PRERELEASE_FLAG
            echo "Created release $TAG (channel=${{ steps.resolve.outputs.channel }})."
          fi

  # ── macOS build ───────────────────────────────────────────────────────────────
  build-mac:
    needs: preflight
    if: >-
      needs.preflight.outputs.should_release == 'true' && (
        github.event_name == 'push' ||
        inputs.platforms == 'all' ||
        inputs.platforms == 'mac'
      )
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Set version
        working-directory: desktop
        run: npm version ${{ needs.preflight.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Create .env for desktop build
        working-directory: desktop
        env:
          TRACKFLOW_API_URL: ${{ secrets.TRACKFLOW_API_URL }}
          TRACKFLOW_WEB_URL: ${{ secrets.TRACKFLOW_WEB_URL }}
          TRACKFLOW_GOOGLE_CLIENT_ID: ${{ secrets.TRACKFLOW_GOOGLE_CLIENT_ID }}
          TRACKFLOW_GOOGLE_CLIENT_SECRET: ${{ secrets.TRACKFLOW_GOOGLE_CLIENT_SECRET }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        run: |
          # Pick the backend by channel so develop builds hit the DEV server, never production.
          if [ "${{ needs.preflight.outputs.channel }}" = "dev" ]; then
            API_URL="https://dev.trackflow.codeupscale.com/api/v1"
            WEB_URL="https://dev.trackflow.codeupscale.com"
          else
            API_URL="${TRACKFLOW_API_URL:-https://trackflow.codeupscale.com/api/v1}"
            WEB_URL="${TRACKFLOW_WEB_URL:-https://trackflow.codeupscale.com}"
          fi
          echo "TRACKFLOW_API_URL=${API_URL}" > .env
          echo "TRACKFLOW_WEB_URL=${WEB_URL}" >> .env
          echo "TRACKFLOW_GOOGLE_CLIENT_ID=${TRACKFLOW_GOOGLE_CLIENT_ID}" >> .env
          echo "TRACKFLOW_GOOGLE_CLIENT_SECRET=${TRACKFLOW_GOOGLE_CLIENT_SECRET}" >> .env
          echo "POSTHOG_KEY=${POSTHOG_KEY}" >> .env
          echo "POSTHOG_HOST=${POSTHOG_HOST:-https://us.i.posthog.com}" >> .env
          echo "Desktop build → channel=${{ needs.preflight.outputs.channel }} API=${API_URL}"

      - name: Build and publish macOS
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # When Apple Developer cert is ready, uncomment:
          # CSC_LINK: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          # CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --x64 --arm64 --publish always

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v6
        with:
          name: mac-builds
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.yml
          retention-days: 5

  # ── Windows build ─────────────────────────────────────────────────────────────
  build-windows:
    needs: preflight
    if: >-
      needs.preflight.outputs.should_release == 'true' && (
        github.event_name == 'push' ||
        inputs.platforms == 'all' ||
        inputs.platforms == 'windows'
      )
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Set version
        working-directory: desktop
        run: npm version ${{ needs.preflight.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Create .env for desktop build
        working-directory: desktop
        shell: bash
        env:
          TRACKFLOW_API_URL: ${{ secrets.TRACKFLOW_API_URL }}
          TRACKFLOW_WEB_URL: ${{ secrets.TRACKFLOW_WEB_URL }}
          TRACKFLOW_GOOGLE_CLIENT_ID: ${{ secrets.TRACKFLOW_GOOGLE_CLIENT_ID }}
          TRACKFLOW_GOOGLE_CLIENT_SECRET: ${{ secrets.TRACKFLOW_GOOGLE_CLIENT_SECRET }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        run: |
          # Pick the backend by channel so develop builds hit the DEV server, never production.
          if [ "${{ needs.preflight.outputs.channel }}" = "dev" ]; then
            API_URL="https://dev.trackflow.codeupscale.com/api/v1"
            WEB_URL="https://dev.trackflow.codeupscale.com"
          else
            API_URL="${TRACKFLOW_API_URL:-https://trackflow.codeupscale.com/api/v1}"
            WEB_URL="${TRACKFLOW_WEB_URL:-https://trackflow.codeupscale.com}"
          fi
          echo "TRACKFLOW_API_URL=${API_URL}" > .env
          echo "TRACKFLOW_WEB_URL=${WEB_URL}" >> .env
          echo "TRACKFLOW_GOOGLE_CLIENT_ID=${TRACKFLOW_GOOGLE_CLIENT_ID}" >> .env
          echo "TRACKFLOW_GOOGLE_CLIENT_SECRET=${TRACKFLOW_GOOGLE_CLIENT_SECRET}" >> .env
          echo "POSTHOG_KEY=${POSTHOG_KEY}" >> .env
          echo "POSTHOG_HOST=${POSTHOG_HOST:-https://us.i.posthog.com}" >> .env
          echo "Desktop build → channel=${{ needs.preflight.outputs.channel }} API=${API_URL}"

      - name: Build and publish Windows
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # When Windows code signing cert is ready, uncomment:
          # CSC_LINK: ${{ secrets.WIN_CERTIFICATE_P12 }}
          # CSC_KEY_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}
        run: npx electron-builder --win --x64 --publish always

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-builds
          path: |
            desktop/dist/*.exe
            desktop/dist/*.yml
          retention-days: 5

  # ── Linux build ───────────────────────────────────────────────────────────────
  build-linux:
    needs: preflight
    if: >-
      needs.preflight.outputs.should_release == 'true' && (
        github.event_name == 'push' ||
        inputs.platforms == 'all' ||
        inputs.platforms == 'linux'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      # uiohook-napi is compiled from source against Electron 42 during
      # install-app-deps and needs the X11 dev headers (X11/keysym.h, etc.).
      # The ubuntu-latest runner ships without them, so install before npm ci.
      - name: Install X11 build dependencies
        run: |
          sudo apt-get update
          # Full set libuiohook needs to compile its X11 backend: Xtst, Xinerama,
          # Xrandr, XInput2, Xkb, etc. Installed comprehensively so the native
          # build doesn't fail one missing header at a time.
          sudo apt-get install -y \
            libx11-dev libxtst-dev libxt-dev libxinerama-dev \
            libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libxkbfile-dev \
            libxrandr-dev libxext-dev libxfixes-dev libxi-dev libxrender-dev

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Set version
        working-directory: desktop
        run: npm version ${{ needs.preflight.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Create .env for desktop build
        working-directory: desktop
        env:
          TRACKFLOW_API_URL: ${{ secrets.TRACKFLOW_API_URL }}
          TRACKFLOW_WEB_URL: ${{ secrets.TRACKFLOW_WEB_URL }}
          TRACKFLOW_GOOGLE_CLIENT_ID: ${{ secrets.TRACKFLOW_GOOGLE_CLIENT_ID }}
          TRACKFLOW_GOOGLE_CLIENT_SECRET: ${{ secrets.TRACKFLOW_GOOGLE_CLIENT_SECRET }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        run: |
          # Pick the backend by channel so develop builds hit the DEV server, never production.
          if [ "${{ needs.preflight.outputs.channel }}" = "dev" ]; then
            API_URL="https://dev.trackflow.codeupscale.com/api/v1"
            WEB_URL="https://dev.trackflow.codeupscale.com"
          else
            API_URL="${TRACKFLOW_API_URL:-https://trackflow.codeupscale.com/api/v1}"
            WEB_URL="${TRACKFLOW_WEB_URL:-https://trackflow.codeupscale.com}"
          fi
          echo "TRACKFLOW_API_URL=${API_URL}" > .env
          echo "TRACKFLOW_WEB_URL=${WEB_URL}" >> .env
          echo "TRACKFLOW_GOOGLE_CLIENT_ID=${TRACKFLOW_GOOGLE_CLIENT_ID}" >> .env
          echo "TRACKFLOW_GOOGLE_CLIENT_SECRET=${TRACKFLOW_GOOGLE_CLIENT_SECRET}" >> .env
          echo "POSTHOG_KEY=${POSTHOG_KEY}" >> .env
          echo "POSTHOG_HOST=${POSTHOG_HOST:-https://us.i.posthog.com}" >> .env
          echo "Desktop build → channel=${{ needs.preflight.outputs.channel }} API=${API_URL}"

      - name: Build and publish Linux
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux --x64 --publish always

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v6
        with:
          name: linux-builds
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.yml
          retention-days: 5

  # ── Update release notes + marketing version ─────────────────────────────────
  update-release-notes:
    needs: [preflight, build-mac, build-windows, build-linux]
    # Production (main) only — this job pushes to main and edits the production
    # release notes. Dev prereleases from develop must not touch main.
    if: always() && needs.preflight.outputs.channel == 'production' && (needs.build-mac.result == 'success' || needs.build-windows.result == 'success' || needs.build-linux.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update marketing version
        run: |
          VER="${{ needs.preflight.outputs.version }}"
          # RELEASE_URL must reference DESKTOP_VERSION (which already carries the leading
          # "v"), NOT a `${VER}` that exists only in this shell and not in the emitted
          # TypeScript module. Getting that wrong re-broke version.ts on every production
          # release and failed deploy.yml's "Marketing type check" gate — which skips the
          # API image build, silently leaving production on a stale backend.
          cat > marketing/src/lib/version.ts <<EOF
          export const DESKTOP_VERSION = 'v${VER}'
          export const RELEASE_URL = \`https://github.com/codeupscale/trackflow/releases/tag/\${DESKTOP_VERSION}\`
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add marketing/src/lib/version.ts
          git diff --staged --quiet || git commit -m "chore: bump marketing desktop version to v${VER}"
          git push origin main

      - name: Update release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v${{ needs.preflight.outputs.version }}"
          VER="${{ needs.preflight.outputs.version }}"
          gh release edit "$VERSION" --notes "## TrackFlow Desktop ${VER}

          ### Downloads

          | Platform | File | Notes |
          |----------|------|-------|
          | **macOS (Apple Silicon)** | \`TrackFlow-${VER}-mac-arm64.dmg\` | M1/M2/M3/M4 |
          | **macOS (Intel)** | \`TrackFlow-${VER}-mac-x64.dmg\` | 2020 and older |
          | **Windows** | \`TrackFlow-${VER}-win-x64.exe\` | Windows 10+ |
          | **Linux (.deb)** | \`TrackFlow-${VER}-linux-amd64.deb\` | Ubuntu/Debian |
          | **Linux (AppImage)** | \`TrackFlow-${VER}-x86_64.AppImage\` | Universal Linux |

          ---

          ### What's New

          **New Features**
          - **Shift info display** — timer window now shows assigned shift name, time range, and break duration when tracking
          - **Branded icons** — new TrackFlow-branded tray icon, app icon, and notification icon across all platforms
          - **Simplified authentication** — streamlined login flow with reduced API overhead

          **Improvements**
          - Redesigned tray icons with idle/tracking states and color variants for better system tray visibility
          - Added dedicated notification icon for macOS/Windows alerts
          - Retina (@2x) tray icon support for high-DPI displays
          - Cleaner main process code — refactored for maintainability

          **Testing**
          - New test coverage: API client error handling, idle alert reappearance after window close, tray click behavior

          ---

          ### Installation

          **macOS:**
          1. Download the \`.dmg\` for your chip (Apple Silicon or Intel)
          2. Open the DMG and drag TrackFlow to Applications
          3. **First launch only** — open Terminal and run:
             \`\`\`
             xattr -cr /Applications/TrackFlow.app
             \`\`\`
          4. Launch TrackFlow from Applications
          5. Grant **Screen Recording** permission when prompted (System Settings → Privacy & Security → Screen Recording)

          **Windows:**
          1. Download the \`.exe\` installer
          2. Run the installer — choose install location if needed
          3. Launch TrackFlow from Start Menu or Desktop shortcut
          4. If upgrading: the installer automatically closes the running app before updating

          **Linux (deb):**
          \`\`\`bash
          sudo dpkg -i TrackFlow-${VER}-linux-amd64.deb
          \`\`\`

          **Linux (AppImage):**
          \`\`\`bash
          chmod +x TrackFlow-${VER}-x86_64.AppImage
          ./TrackFlow-${VER}-x86_64.AppImage
          \`\`\`

          ---

          ### Uninstallation

          **macOS:**
          1. Quit TrackFlow (right-click tray icon → Quit)
          2. Drag TrackFlow from Applications to Trash
          3. To remove data: \`rm -rf ~/Library/Application\ Support/trackflow-agent\`

          **Windows:**
          1. Open Settings → Apps → Installed Apps
          2. Find TrackFlow → Uninstall
          3. Or run the uninstaller from Start Menu → TrackFlow → Uninstall
          4. To remove data: delete \`%APPDATA%/trackflow-agent\`

          **Linux:**
          \`\`\`bash
          # deb
          sudo dpkg -r trackflow-agent

          # AppImage — just delete the file
          rm TrackFlow-*.AppImage

          # Remove data
          rm -rf ~/.config/trackflow-agent
          \`\`\`

          ---

          ### Troubleshooting

          **macOS: \"app is damaged\" or won't open**
          \`\`\`bash
          xattr -cr /Applications/TrackFlow.app
          \`\`\`

          **macOS: Screen Recording permission**
          System Settings → Privacy & Security → Screen Recording → Enable TrackFlow.
          If TrackFlow is not listed, restart the app.

          **All platforms: \"Cannot reach the server\"**
          The server is likely reachable but your DNS cache is stale. Fix:
          - **macOS:** \`sudo dscacheutil -flushcache && sudo killall -HUP mDNSResponder\`
          - **Windows:** Run \`ipconfig /flushdns\` in Command Prompt (as Administrator)
          - **Linux:** \`sudo systemd-resolve --flush-caches\`
          Then retry login — no app restart needed.

          **Windows: \"Failed to uninstall old application files\"**
          The installer automatically closes the running app. If you still see this, close TrackFlow from the system tray before running the installer.

          **Empty project list after login**
          Sign out → close app completely → reopen → sign in.

          **View logs:**
          - macOS: \`~/Library/Application Support/trackflow-agent/trackflow.log\`
          - Windows: \`%APPDATA%/trackflow-agent/trackflow.log\`
          - Linux: \`~/.config/trackflow-agent/trackflow.log\`
          "

  # ── Keep desktop/package.json honest on develop ──────────────────────────────
  # Production only. After a release ships, write the NEXT patch into
  # desktop/package.json on develop so the committed number tracks reality instead
  # of drifting (it sat at 1.0.43 while production was on v1.0.46). Preflight no
  # longer DEPENDS on this — main resolves past shipped versions on its own — this
  # just keeps the file meaningful and starts the next dev prerelease from the
  # right base.
  #
  # Pushes to DEVELOP, never main: a push to main touching desktop/** would
  # retrigger this workflow and immediately release the bumped version. (A push
  # made with GITHUB_TOKEN does not trigger workflows, and [skip ci] is a second
  # guard, but the branch choice is the real one.)
  bump-develop-version:
    needs: [preflight, build-mac, build-windows, build-linux]
    if: always() && needs.preflight.outputs.channel == 'production' && (needs.build-mac.result == 'success' || needs.build-windows.result == 'success' || needs.build-linux.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump desktop/package.json to the next patch
        run: |
          RELEASED="${{ needs.preflight.outputs.version }}"
          NEXT=$(echo "${RELEASED}" | awk -F. '{printf "%d.%d.%d", $1, $2, $3 + 1}')
          CURRENT=$(node -p 'require("./desktop/package.json").version')

          # Never move the version BACKWARDS — develop may already be ahead if a
          # minor/major was bumped by hand for the next cycle.
          HIGHEST=$(printf '%s\n%s\n' "${CURRENT}" "${NEXT}" | sort -V | tail -1)
          if [ "${HIGHEST}" = "${CURRENT}" ] && [ "${CURRENT}" != "${NEXT}" ]; then
            echo "develop is already at ${CURRENT} (ahead of ${NEXT}) — leaving it alone."
            exit 0
          fi

          ( cd desktop && npm version "${NEXT}" --no-git-tag-version --allow-same-version )

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add desktop/package.json desktop/package-lock.json
          if git diff --staged --quiet; then
            echo "desktop/package.json already at ${NEXT} — nothing to commit."
            exit 0
          fi
          git commit -m "chore(desktop): bump version to ${NEXT} after v${RELEASED} [skip ci]"

          # develop moves constantly; rebase and retry rather than failing the run.
          git push origin develop || {
            git pull --rebase origin develop && git push origin develop
          }
          echo "::notice::desktop/package.json on develop is now ${NEXT}."

  # ── Finalize dev prerelease ──────────────────────────────────────────────────
  # Dev channel only. The release is pre-created as a prerelease in preflight, but
  # electron-builder (releaseType=release) can flip the flag while uploading. This
  # job re-asserts prerelease=true after the builds so dev releases never show up
  # as "Latest". Runs if at least one platform produced artifacts.
  finalize-dev-prerelease:
    needs: [preflight, build-mac, build-windows, build-linux]
    if: always() && needs.preflight.outputs.channel == 'dev' && (needs.build-mac.result == 'success' || needs.build-windows.result == 'success' || needs.build-linux.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Enforce prerelease flag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.preflight.outputs.version }}"
          # The release can legitimately be gone by now — someone may have deleted
          # an in-flight build. Don't fail the run over it; the cleanup job owns
          # reclaiming the tag.
          if ! gh release view "$TAG" --repo ${{ github.repository }} >/dev/null 2>&1; then
            echo "::warning::Release $TAG no longer exists — nothing to flag."
            exit 0
          fi
          gh release edit "$TAG" \
            --repo ${{ github.repository }} \
            --prerelease --draft=false

  # ── Reclaim a failed dev release ─────────────────────────────────────────────
  # Preflight creates the release — and therefore the TAG — before any platform
  # build runs, so a failed build leaves behind either a half-populated release or
  # (if someone deletes that release by hand, which does not remove the tag) a
  # dangling tag. Both are harmful: an incomplete asset set means a missing
  # latest-*.yml and a broken auto-update channel for that platform, and the
  # leftover tag permanently burns a -dev.<n> number, since the counter in
  # preflight is "highest existing dev tag + 1". This is what stranded
  # v1.0.46-dev.1 (tagged 06e3e615, never published) and made numbering jump to
  # -dev.2. Dev channel only — a production tag is never deleted automatically.
  cleanup-failed-dev-release:
    needs: [preflight, build-mac, build-windows, build-linux]
    if: >-
      always() && needs.preflight.outputs.channel == 'dev'
      && needs.preflight.outputs.should_release == 'true'
      && (needs.build-mac.result != 'success'
          || needs.build-windows.result != 'success'
          || needs.build-linux.result != 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Delete the incomplete release and reclaim its tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.preflight.outputs.version }}"
          echo "Incomplete dev build (mac=${{ needs.build-mac.result }}" \
               "win=${{ needs.build-windows.result }}" \
               "linux=${{ needs.build-linux.result }}) — reclaiming $TAG."

          # --cleanup-tag removes the tag with the release. Deleting the release
          # WITHOUT it is exactly how the dev.1 tag was orphaned.
          if gh release view "$TAG" --repo ${{ github.repository }} >/dev/null 2>&1; then
            gh release delete "$TAG" --repo ${{ github.repository }} --yes --cleanup-tag
            echo "Deleted release $TAG and its tag."
          fi

          # The release may already be gone while the tag survives; drop it directly.
          if gh api "repos/${{ github.repository }}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/${TAG}"
            echo "Deleted dangling tag $TAG."
          fi

          echo "::notice::Reclaimed $TAG — the next dev build will reuse this number."
